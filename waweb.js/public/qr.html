<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp QR Code</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            padding: 12px;
        }
        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }
        .qr-box {
            width: 220px; height: 220px;
            background: #f8fafc;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(37,99,235,0.08);
            border: 2px solid #3b82f6;
            overflow: hidden;
        }
        .qr-box img { width: 200px; height: 200px; border-radius: 8px; }
        .placeholder {
            display: flex; flex-direction: column; align-items: center; gap: 10px;
            color: #64748b;
        }
        .placeholder .icon { font-size: 42px; color: #2563eb; }
        .placeholder p { font-size: 13px; text-align: center; font-weight: 500; }
        .status {
            font-size: 13px;
            color: #475569;
            text-align: center;
            line-height: 1.5;
        }
        .status strong { color: #0f172a; display: block; margin-bottom: 2px; font-weight: 700; }
        .dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: #f59e0b;
            animation: pulse 1.5s infinite;
            margin-right: 6px;
            vertical-align: middle;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
        .dot.green { background: #10b981; }
        .dot.red { background: #ef4444; animation: none; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="qr-box">
        <div class="placeholder" id="placeholder">
            <div class="icon">📱</div>
            <p>Menunggu<br>QR Code...</p>
        </div>
        <img id="qrImg" src="" alt="QR Code" style="display:none;">
    </div>
    <div class="status" id="statusText">
        <span class="dot" id="dot"></span>
        <strong id="statusTitle">Menghubungkan...</strong>
        <span id="statusDesc">Menghubungkan ke server</span>
    </div>
</div>

<script>
const ws = new WebSocket(`ws://${location.host}`);

ws.onmessage = (evt) => {
    try {
        const { event, data } = JSON.parse(evt.data);
        if (event === 'qr') {
            showQR(data.qrDataURL);
        } else if (event === 'state') {
            if (data.status === 'QR' && data.qr) {
                fetch('/api/qr?token=' + encodeURIComponent(getToken()))
                    .then(r => r.json())
                    .then(d => { if (d.qrDataURL) showQR(d.qrDataURL); });
            } else if (data.status === 'READY') {
                showConnected();
            }
        } else if (event === 'ready') {
            showConnected();
        } else if (event === 'authenticated') {
            document.getElementById('statusTitle').textContent = 'Autentikasi Berhasil!';
            document.getElementById('statusDesc').textContent = 'Memuat sesi WhatsApp...';
            document.getElementById('dot').className = 'dot green';
        } else if (event === 'disconnected') {
            showDisconnected();
        }
    } catch(e) {}
};

ws.onclose = () => {
    showDisconnected();
    setTimeout(() => location.reload(), 4000);
};

function getToken() {
    const params = new URLSearchParams(location.search);
    return params.get('token') || '';
}

function showQR(dataURL) {
    document.getElementById('qrImg').src = dataURL;
    document.getElementById('qrImg').style.display = 'block';
    document.getElementById('placeholder').style.display = 'none';
    document.getElementById('dot').className = 'dot';
    document.getElementById('statusTitle').textContent = 'QR Code Siap!';
    document.getElementById('statusDesc').textContent = 'Buka WhatsApp > Perangkat Tertaut > Scan';
}

function showConnected() {
    document.getElementById('qrImg').style.display = 'none';
    document.getElementById('placeholder').style.display = 'flex';
    document.getElementById('placeholder').innerHTML = '<div class="icon" style="color:#10b981;">✅</div><p style="color:#0f172a;font-weight:600;">Terhubung!</p>';
    document.getElementById('dot').className = 'dot green';
    document.getElementById('statusTitle').textContent = 'WhatsApp Aktif';
    document.getElementById('statusDesc').textContent = 'Siap menerima & mengirim pesan';
}

function showDisconnected() {
    document.getElementById('dot').className = 'dot red';
    document.getElementById('statusTitle').textContent = 'Koneksi Terputus';
    document.getElementById('statusDesc').textContent = 'Mencoba menyambung kembali...';
}
</script>
</body>
</html>
